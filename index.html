<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Checklist TI Loja</title>

<link rel="icon" href="https://cdn.worldvectorlogo.com/logos/tenda-atacado-logo.svg">

<style>

:root{
  --brand:#0d47a1;
  --ok:#16a34a;
  --warn:#f59e0b;
  --crit:#dc2626;
  --gray:#6b7280;
  --bg:#f3f4f6;
  --card:#ffffff;
  --border:#e5e7eb;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:#111;
}

#app{
  max-width:500px;
  margin:auto;
  min-height:100vh;
  background:white;
  position:relative;
}

/* LOADING */

#loading-screen{
  position:fixed;
  inset:0;
  background:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:9999;
  animation:fadeOut 1s forwards;
  animation-delay:2s;
}

.loading-logo{
  width:120px;
  animation:pulse 1.5s infinite;
}

.loader{
  width:50px;
  height:50px;
  border:5px solid #eee;
  border-top:5px solid #dc2626;
  border-radius:50%;
  margin-top:20px;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

@keyframes pulse{
  50%{transform:scale(1.06);}
}

@keyframes fadeOut{
  to{
    opacity:0;
    visibility:hidden;
  }
}

/* TOPO */

.topo{
  background:white;
  padding:15px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--border);
}

.logo{
  width:80px;
}

.topo h1{
  font-size:18px;
  color:var(--brand);
}

.topo p{
  font-size:12px;
  color:var(--gray);
}

/* INFO */

.info{
  background:var(--brand);
  padding:12px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.info input{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  font-size:13px;
}

.progress{
  background:#dbeafe;
  height:8px;
  border-radius:999px;
  overflow:hidden;
  margin:12px;
}

.progress-fill{
  background:var(--brand);
  height:100%;
  width:0%;
  transition:0.3s;
}

/* TABS */

.tabs{
  display:flex;
  overflow:auto;
  border-bottom:1px solid var(--border);
  background:white;
}

.tab{
  padding:12px;
  font-size:13px;
  white-space:nowrap;
  cursor:pointer;
  border-bottom:3px solid transparent;
}

.tab.active{
  border-color:var(--brand);
  color:var(--brand);
  font-weight:bold;
}

/* ITEMS */

#content{
  padding-bottom:120px;
}

.item{
  background:white;
  padding:14px;
  border-bottom:1px solid var(--border);
}

.item-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.item-text{
  font-size:14px;
  flex:1;
}

.buttons{
  display:flex;
  gap:4px;
}

.btn{
  width:35px;
  height:32px;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
  color:white;
}

.ok{background:var(--ok);}
.warn{background:var(--warn);}
.crit{background:var(--crit);}
.na{background:var(--gray);}

textarea{
  width:100%;
  margin-top:10px;
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px;
  resize:none;
  min-height:60px;
}

.qty{
  width:80px;
  padding:8px;
  border:1px solid var(--border);
  border-radius:8px;
}

/* FOOTER */

.footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  max-width:500px;
  margin:auto;
  background:white;
  border-top:1px solid var(--border);
  padding:10px;
  display:flex;
  gap:10px;
}

.score{
  flex:1;
  background:#eff6ff;
  border-radius:10px;
  padding:10px;
}

.score h2{
  font-size:24px;
  color:var(--brand);
}

.save{
  background:var(--brand);
  color:white;
  border:none;
  border-radius:10px;
  padding:14px 18px;
  font-weight:bold;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- LOADING -->
<div id="loading-screen">
  <img src="https://cdn.worldvectorlogo.com/logos/tenda-atacado-logo.svg" class="loading-logo">
  <div class="loader"></div>
</div>

<div id="app">

<!-- TOPO -->
<div class="topo">
  <img src="https://cdn.worldvectorlogo.com/logos/tenda-atacado-logo.svg" class="logo">

  <div>
    <h1>Checklist TI Loja</h1>
    <p>Sistema de Vistorias</p>
  </div>
</div>

<!-- INFO -->
<div class="info">
  <input id="loja" placeholder="Loja">
  <input id="data" type="date">

  <input id="resp" placeholder="Responsável">
  <input id="regional" placeholder="Regional">
</div>

<!-- PROGRESS -->
<div class="progress">
  <div class="progress-fill" id="progressFill"></div>
</div>

<!-- TABS -->
<div class="tabs" id="tabs"></div>

<!-- CONTENT -->
<div id="content"></div>

<!-- FOOTER -->
<div class="footer">

  <div class="score">
    <small>Score Geral</small>
    <h2 id="score">0%</h2>
  </div>

  <button class="save" onclick="salvarChecklist()">
    Salvar
  </button>

</div>

</div>

<script>

document.getElementById('data').value =
new Date().toISOString().split('T')[0];

const sections = [

{
id:'geral',
label:'Geral',
items:[
{id:'g1',text:'Gerente presente',type:'status'},
{id:'g2',text:'Resp. TI presente',type:'status'},
{id:'g3',text:'PDVs padrão abertos',type:'status'},
{id:'g4',text:'Fila PDV',type:'qty'}
]
},

{
id:'cftv',
label:'CFTV',
items:[
{id:'c1',text:'Todas câmeras funcionando',type:'status'},
{id:'c2',text:'Gravação ativa',type:'status'},
{id:'c3',text:'Imagem adequada',type:'status'}
]
},

{
id:'rede',
label:'Rede',
items:[
{id:'r1',text:'Wi-Fi funcionando',type:'status'},
{id:'r2',text:'Rack organizado',type:'status'}
]
},

{
id:'cpd',
label:'CPD',
items:[
{id:'p1',text:'CPD organizado',type:'status'},
{id:'p2',text:'Sem sucata',type:'status'}
]
}

];

let current='geral';
const state={};

function renderTabs(){

  const el=document.getElementById('tabs');

  el.innerHTML=sections.map(sec=>`
  
    <div
      class="tab ${sec.id===current?'active':''}"
      onclick="trocar('${sec.id}')">

      ${sec.label}

    </div>

  `).join('');

}

function render(){

  const sec=sections.find(s=>s.id===current);

  const el=document.getElementById('content');

  let html='';

  sec.items.forEach(item=>{

    const s=state[item.id]||{};

    html+=`
    
    <div class="item">

      <div class="item-top">

        <div class="item-text">
          ${item.text}
        </div>

    `;

    if(item.type==='status'){

      html+=`
      
      <div class="buttons">

        <button class="btn ok"
        onclick="setStatus('${item.id}','ok')">
        ✓
        </button>

        <button class="btn warn"
        onclick="setStatus('${item.id}','warn')">
        !
        </button>

        <button class="btn crit"
        onclick="setStatus('${item.id}','crit')">
        ✗
        </button>

        <button class="btn na"
        onclick="setStatus('${item.id}','na')">
        N/A
        </button>

      </div>
      </div>

      <textarea
      placeholder="Observação..."
      oninput="setObs('${item.id}',this.value)">${s.obs||''}</textarea>
      
      `;

    }else{

      html+=`
      
      <input
      class="qty"
      type="number"
      placeholder="Qtd"
      value="${s.qty||''}"
      oninput="setQty('${item.id}',this.value)">
      
      </div>
      `;

    }

    html+=`</div>`;

  });

  el.innerHTML=html;

  updateScore();

}

function trocar(id){
  current=id;
  renderTabs();
  render();
}

function setStatus(id,status){

  if(!state[id]) state[id]={};

  state[id].status=status;

  updateScore();

}

function setObs(id,val){

  if(!state[id]) state[id]={};

  state[id].obs=val;

}

function setQty(id,val){

  if(!state[id]) state[id]={};

  state[id].qty=val;

}

function updateScore(){

  const all=[];

  sections.forEach(sec=>{
    sec.items.forEach(i=>{
      if(i.type==='status') all.push(i.id);
    });
  });

  let pts=0;

  all.forEach(id=>{

    const s=state[id]?.status;

    if(s==='ok') pts+=1;
    if(s==='warn') pts+=0.5;

  });

  const total=all.length;

  const score=Math.round((pts/total)*100);

  document.getElementById('score').innerText=
  score+'%';

  const filled=all.filter(id=>state[id]?.status).length;

  document.getElementById('progressFill').style.width=
  ((filled/total)*100)+'%';

}

async function salvarChecklist(){

  const gasUrl=localStorage.getItem('gas_url');

  if(!gasUrl){

    const url=prompt('Cole URL do Apps Script');

    if(!url) return;

    localStorage.setItem('gas_url',url);

  }

  const rows=[];

  sections.forEach(sec=>{

    sec.items.forEach(item=>{

      const s=state[item.id]||{};

      rows.push([
        document.getElementById('loja').value,
        document.getElementById('data').value,
        document.getElementById('resp').value,
        document.getElementById('regional').value,
        sec.label,
        item.text,
        s.status||'',
        s.qty||'',
        s.obs||'',
        new Date().toLocaleString('pt-BR')
      ]);

    });

  });

  const payload={

    sheetName:'Checklist TI Lojas',

    headers:[
      'Loja',
      'Data',
      'Responsável',
      'Regional',
      'Seção',
      'Item',
      'Status',
      'Quantidade',
      'Observação',
      'Salvo Em'
    ],

    rows

  };

  try{

    const res=await fetch(
      localStorage.getItem('gas_url'),
      {
        method:'POST',
        headers:{
          'Content-Type':'text/plain'
        },
        body:JSON.stringify(payload)
      }
    );

    alert('Checklist salvo com sucesso!');

  }catch(e){

    alert('Erro ao salvar');

  }

}

renderTabs();
render();

</script>

</body>
</html>
