function safeJsonGet(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (_) { return fallback; }
}
function safeJsonSet(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {} }
function loadActionPlans() { const v = safeJsonGet(ACTION_PLANS_KEY, []); return Array.isArray(v) ? v : []; }
function saveActionPlans(list) { safeJsonSet(ACTION_PLANS_KEY, list); }
function loadAgenda() { const v = safeJsonGet(AGENDA_KEY, []); return Array.isArray(v) ? v : []; }
function saveAgenda(list) { safeJsonSet(AGENDA_KEY, list); }
function getEvaluationId() { return localStorage.getItem(EVALUATION_ID_KEY) || ''; }
function generateEvaluationId() {
  const loja = getStoreCode(document.getElementById('fLoja')?.value || 'LOJA');
  const date = (document.getElementById('fData')?.value || new Date().toISOString().slice(0,10)).replace(/-/g,'');
  const id = `${loja}-${date}-${Math.random().toString(36).slice(2,7).toUpperCase()}`;
  localStorage.setItem(EVALUATION_ID_KEY, id);
  showToast(`ID da vistoria: ${id}`, 'success');
  updateOpsCenter();
  return id;
}
function ensureEvaluationId() { return getEvaluationId() || generateEvaluationId(); }

function openOpsCenter() { ensureEvaluationId(); updateOpsCenter(); openModal('opsCenterModal'); }
function updateOpsCenter() {
  const plans = loadActionPlans();
  const agenda = loadAgenda();
  const evidence = countAllEvidence();
  const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
  set('opsKpiActions', plans.length); set('opsKpiOpen', plans.filter(p => p.status !== 'done').length); set('opsKpiEvidence', evidence); set('opsKpiAgenda', agenda.filter(a => a.status !== 'done').length);
  const hint = document.getElementById('opsEvaluationIdHint'); if (hint) hint.textContent = `ID desta vistoria: ${getEvaluationId() || '—'}`;
  renderActionPlans(); renderAgenda(); renderSignaturePreview(); renderAllEvidence();
}
function countAllEvidence() {
  return Object.values(State.items || {}).reduce((sum, st) => sum + ((st && Array.isArray(st.evidence)) ? st.evidence.length : 0), 0) + Object.values(State.printers || {}).reduce((sum, st) => sum + ((st && Array.isArray(st.evidence)) ? st.evidence.length : 0), 0);
}
function compressEvidence(dataUrl, maxW=1200, quality=.68) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const ratio = Math.min(1, maxW / Math.max(img.naturalWidth || maxW, 1));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round((img.naturalWidth || maxW) * ratio));
      c.height = Math.max(1, Math.round((img.naturalHeight || 800) * ratio));
      const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}
function openEvidencePicker(key) {
  activeEvidenceKey = key;
  const item = State.items[key] || (State.items[key] = {status:null,qty:'',obs:'',ts:null,evidence:[]});
  item.evidence = Array.isArray(item.evidence) ? item.evidence : [];
  const si = Number(key.split('-')[0]), ii = Number(key.split('-')[1]);
  const title = document.getElementById('evidenceItemTitle');
  if (title) title.textContent = `${SECTIONS[si]?.title || 'Item'} · ${SECTIONS[si]?.items[ii] || key}`;
  const input = document.getElementById('evidenceFileInput');
  if (input) input.value = '';

}
function openPrinterEvidencePicker(key) {
  activeEvidenceKey = `printer:${key}`;
  const state = State.printers[key] || (State.printers[key] = {status:null,obs:'',ts:null,evidence:[]});

  const title = document.getElementById('evidenceItemTitle');

  renderEvidenceModal(); openModal('evidenceModal');
}
function getActiveEvidenceList() {
  if (!activeEvidenceKey) return [];
  if (String(activeEvidenceKey).startsWith('printer:')) { const k=String(activeEvidenceKey).slice(8); const st=State.printers[k] || (State.printers[k]={status:null,obs:'',ts:null,evidence:[]}); st.evidence=Array.isArray(st.evidence)?st.evidence:[]; return st.evidence; }
  const st=State.items[activeEvidenceKey] || (State.items[activeEvidenceKey]={status:null,qty:'',obs:'',ts:null,evidence:[]}); st.evidence=Array.isArray(st.evidence)?st.evidence:[]; return st.evidence;
}

function renderEvidenceModal() {
  const grid = document.getElementById('evidenceItemGrid'); if (!grid) return;
  const list = getActiveEvidenceList();
  grid.innerHTML = list.length ? list.map((ev, idx) => `<div class="evidence-preview-card"><img src="${ev.dataUrl}" alt="${escapeHtml(ev.name || 'evidência')}"><div>${escapeHtml(ev.name || 'Evidência')} · <button type="button" class="ops-feature-btn" style="min-height:22px;padding:0 6px;font-size:9px" onclick="removeEvidence(${idx})">Excluir</button></div></div>`).join('') : '<div style="font-size:10px;color:var(--text-secondary)">Nenhuma evidência adicionada.</div>';
}
function renderPrinterEvidence(key) {

  const strip=document.getElementById(`printer-ev-strip-${key}`), count=document.getElementById(`printer-ev-count-${key}`);
  if(count) count.textContent=list.length?`${list.length} evidência(s)`:'';
  if(strip) strip.innerHTML=list.slice(0,4).map(ev=>`<img class="item-evidence-thumb" src="${ev.dataUrl}" alt="evidência">`).join('');
}
function renderItemEvidence(key) {
  const state = State.items[key]; const list = Array.isArray(state?.evidence) ? state.evidence : [];
  const strip = document.getElementById(`ev-strip-${key}`); const count = document.getElementById(`ev-count-${key}`);
  if (count) count.textContent = list.length ? `${list.length} evidência(s)` : '';
  if (strip) strip.innerHTML = list.slice(0,4).map(ev => `<img class="item-evidence-thumb" src="${ev.dataUrl}" alt="evidência">`).join('');
}
async function processEvidenceFiles(files) {
  if (!activeEvidenceKey) return;
  const isPrinterEvidence = String(activeEvidenceKey).startsWith('printer:');
  const targetKey = isPrinterEvidence ? String(activeEvidenceKey).slice(8) : activeEvidenceKey;
  const state = isPrinterEvidence ? (State.printers[targetKey] || (State.printers[targetKey] = {status:null,obs:'',ts:null,evidence:[]})) : (State.items[targetKey] || (State.items[targetKey] = {status:null,qty:'',obs:'',ts:null,evidence:[]}));
  state.evidence = Array.isArray(state.evidence) ? state.evidence : [];
  for (const file of Array.from(files || [])) {
    if (!(file.type || '').startsWith('image/')) continue;
    if (file.size > 10 * 1024 * 1024) { showToast(`${file.name} é grande demais para evidência.`, 'error'); continue; }
    const dataUrl = await new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsDataURL(file); });
    const compact = await compressEvidence(dataUrl);
    state.evidence.push({id:`ev-${Date.now()}-${Math.random().toString(36).slice(2,7)}`, name:file.name, dataUrl:compact, ts:new Date().toISOString()});
  }
  autoSave();
  renderEvidenceModal(); if(isPrinterEvidence) renderPrinterEvidence(targetKey); else renderItemEvidence(targetKey); updateOpsCenter();
  showToast('Evidências adicionadas.', 'success');
}
function removeEvidence(idx) {
  if (!activeEvidenceKey) return;
  const list = getActiveEvidenceList();
  list.splice(idx,1);
  autoSave(); autoSavePrinters(); renderEvidenceModal(); if(String(activeEvidenceKey).startsWith('printer:')) renderPrinterEvidence(String(activeEvidenceKey).slice(8)); else renderItemEvidence(activeEvidenceKey); updateOpsCenter();
}

function openActionPlanForItem(key) {

function saveActionPlanFromForm(sourceKey='') {

  if (!title) { showToast('Informe o que precisa ser corrigido.', 'error'); return; }

    id:`pa-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,

  activeActionSourceKey = '';
  clearActionPlanForm(); updateOpsCenter(); showToast('Plano de ação salvo.', 'success');
}
let activeActionSourceKey = '';
// Override openActionPlanForItem with explicit source binding after function declaration above.
const _openActionPlanForItem = openActionPlanForItem;
openActionPlanForItem = function(key) { activeActionSourceKey = key; _openActionPlanForItem(key); };

  const pr=document.getElementById('actionPlanPriority'); if(pr) pr.value='normal';

function openSignaturePad(){ closeModal('opsCenterModal'); openModal('signatureModal'); setupSignatureCanvas(); }
function setupSignatureCanvas(){ const c=document.getElementById('signatureCanvas'); if(!c)return; const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); const old=localStorage.getItem(SIGNATURE_KEY); if(old){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,c.width,c.height); img.src=old; } let drawing=false; const point=e=>{const r=c.getBoundingClientRect(); const sx=c.width/r.width, sy=c.height/r.height; const src=e.touches?e.touches[0]:e; return {x:(src.clientX-r.left)*sx,y:(src.clientY-r.top)*sy};}; c.onpointerdown=e=>{drawing=true;const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);}; c.onpointermove=e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.strokeStyle='#111827';ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke();}; c.onpointerup=()=>drawing=false; c.onpointercancel=()=>drawing=false; c.onpointerleave=()=>drawing=false; }
function clearSignaturePad(){const c=document.getElementById('signatureCanvas');if(!c)return;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);}
function saveSignature(){const c=document.getElementById('signatureCanvas');if(!c)return;localStorage.setItem(SIGNATURE_KEY,c.toDataURL('image/png'));showToast('Assinatura salva.','success');closeModal('signatureModal');updateOpsCenter();}
function renderSignaturePreview(){const wrap=document.getElementById('signaturePreviewWrap');if(!wrap)return;const sig=localStorage.getItem(SIGNATURE_KEY);wrap.innerHTML=sig?`<img src="${sig}" alt="Assinatura" style="max-width:260px;height:82px;object-fit:contain;background:#fff;border:1px solid var(--border);border-radius:8px"><div style="margin-top:5px"><button type="button" class="ops-feature-btn" onclick="localStorage.removeItem(SIGNATURE_KEY);updateOpsCenter();">Remover assinatura</button></div>`:'Nenhuma assinatura registrada.';}
function renderAllEvidence(){const grid=document.getElementById('opsEvidenceGrid'),empty=document.getElementById('opsEvidenceEmpty');if(!grid)return;const all=[];SECTIONS.forEach((sec,si)=>sec.items.forEach((item,ii)=>{const key=`${si}-${ii}`;(State.items[key]?.evidence||[]).forEach(ev=>all.push({...ev,title:item,section:sec.title,key}));}));Object.entries(State.printers||{}).forEach(([key,st])=>(st.evidence||[]).forEach(ev=>all.push({...ev,title:`Impressora S/N ${key}`,section:'Impressoras',key:`printer:${key}`})));if(empty)empty.style.display=all.length?'none':'';grid.innerHTML=all.map(ev=>`<div class="evidence-preview-card"><img src="${ev.dataUrl}" alt="evidência"><div>${escapeHtml(ev.section)} · ${escapeHtml(ev.title)}</div></div>`).join('');}
function downloadLocalEvidenceBundle(){
  const payload=buildPayload(); const backup={version:2,exportedAt:new Date().toISOString(),evaluationId:ensureEvaluationId(),payload,stateSnapshot:State.items,printerSnapshot:State.printers,actionPlans:loadActionPlans(),agenda:loadAgenda(),signature:localStorage.getItem(SIGNATURE_KEY)||''};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a');a.href=url;a.download=`backup-${getReportFilename('vistoria')}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('Backup completo exportado.','success');
}
function reopenSavedSubmission(id){
  const item=loadSavedSubmissions().find(x=>x.id===id); if(!item) return;
  try {
    if(item.stateSnapshot) Object.assign(State.items, JSON.parse(JSON.stringify(item.stateSnapshot)));

}

const _origHandleStatusFeature = handleStatusClick;

};
